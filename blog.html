<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog — Your Choice Garments</title>
<meta name="description" content="Articles on Tiruppur garment manufacturing, bulk T-shirt sourcing, fabrics, custom printing, private label and quality.">
<link rel="stylesheet" href="css/styles.css">
<script defer src="js/config.js"></script><script defer src="js/blog.js"></script><script defer src="js/common.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/brand/favicon.png"><link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<meta name="keywords" content="Tiruppur garment manufacturer, wholesale T-shirts Tiruppur, bulk apparel supplier, custom T-shirts, polo T-shirts, oversized T-shirts, hoodies, sweatshirts, private label garments, garment factory Tiruppur">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://your-choice-garments.vercel.app/blog.html">
</head><body>
<div id="site-header"></div>
<section class="page-hero"><div class="container">
 <p class="eyebrow">Blog</p>
 <h1>Notes from a Tiruppur garment manufacturer.</h1>
 <p>Practical reading on sourcing, fabrics, customisation, private label and quality — written for brands, retailers and buyers.</p>
</div></section>
<section class="section">
 <div class="container">
  <div class="product-grid" id="blogGrid"></div>
 </div>
</section>
<div id="site-footer"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 document.getElementById('blogGrid').innerHTML=window.BLOGS.map(b=>`<article class="pcard">
  <a class="thumb" href="blog-post.html?id=${b.id}"><img src="${b.img}" alt="${b.title} — Your Choice Garments Tiruppur blog" loading="lazy"></a>
  <div class="body">
    <div><h3>${b.title}</h3><p style="font-size:12px;color:var(--muted)">${b.date}</p></div>
    <p>${b.excerpt}</p>
    <div class="actions"><a class="btn btn-ghost" href="blog-post.html?id=${b.id}">Read article</a></div>
  </div>
 </article>`).join('');
});
</script>
</body></html>
